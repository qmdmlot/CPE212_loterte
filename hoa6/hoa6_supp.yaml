---
- hosts: all
  become: true
  pre_tasks:
  - name: install updates (CentOS)
    tags: always
    dnf:
      update_only: yes
      update_cache: yes
    when: ansible_distribution == "CentOS"

  - name: install updates (Ubuntu)
    tags: always
    apt:
      upgrade: dist
      update_cache: yes
    when: ansible_distribution == "Ubuntu"



- hosts: web_servers
  become: true
  roles:
    - web_servers
  tags: web

- hosts: db_servers
  become: true
  roles:
    - db_servers
  tags: db

- hosts: file_servers
  become: true
  roles:
    - file_servers
  tags: file
