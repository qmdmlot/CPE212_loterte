---
# tasks file for common
- name: Install updates (CentOS)
  dnf:
    update_only: yes
    state: latest
    update_cache: true
  when: ansible_distribution == "CentOS"
  tags: always

- name: Install updates (Ubuntu)
  apt:
    upgrade: dist
    update_cache: yes
  when: ansible_distribution == "Ubuntu"
  tags: always
